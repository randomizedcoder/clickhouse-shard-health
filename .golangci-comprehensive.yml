# .golangci-comprehensive.yml
#
# Tier 2: Comprehensive Lint (~10 minutes)
# Used for: Nightly CI, pre-release validation
#
# This is the most thorough profile. It includes all Tier 0 and Tier 1
# checks plus additional analysis for code quality, complexity, and style.

version: "2"

run:
  timeout: 15m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Tier 0 (always)
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    # Tier 1 (CI)
    - gosec
    - gocritic
    - revive
    - noctx
    - durationcheck
    # Tier 2 (Comprehensive)
    - exhaustive
    - prealloc
    - gocyclo
    - funlen
    - goconst
    - dupl
    - unconvert
    - nakedret
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintln
        - fmt.Fprintf

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true

    staticcheck:
      checks:
        - "all"

    gosec:
      excludes:
        - G115  # integer overflow: false positives for validated conversions
        - G304  # file path from variable: config loading uses CONFIG_PATH env var

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration

    gocyclo:
      min-complexity: 20

    funlen:
      lines: 100
      statements: 60

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true

    goconst:
      min-len: 3
      min-occurrences: 3

    dupl:
      threshold: 150

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

  exclusions:
    warn-unused: true
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
          - funlen
          - gocyclo
          - errcheck
          - goconst
      # G404: math/rand is acceptable in tests
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G404"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
